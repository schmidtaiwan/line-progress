<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>Jason追蹤表</title>
<script>
(function () {
  try {
    var mobile = false;
    if (window.matchMedia && window.matchMedia("(max-width: 900px)").matches) mobile = true;
    else if (/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || "")) mobile = true;
    if (mobile) {
      document.documentElement.classList.add("is-mobile");
      document.addEventListener("DOMContentLoaded", function () {
        document.body.classList.add("is-mobile");
      });
    }
  } catch (e) {}
})();
</script>
<style>
  :root {
    --bg: #eef1f4;
    --card: #ffffff;
    --ink: #1c2430;
    --muted: #5c6775;
    --line: #d8dee6;
    --board: #1f6f9a;
    --assy: #1c8a5a;
    --test: #d06a12;
    --high: #c0392b;
    --mid: #b86e00;
    --low: #1e7a46;
    --delay: #c0392b;
    --run: #1d6fa5;
    --done: #1e7a46;
    --idle: #66707c;
    --shadow: 0 1px 2px rgba(20, 32, 48, 0.06), 0 8px 24px rgba(20, 32, 48, 0.05);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
    font-size: 14px;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  .tab-short { display: none; }
  .m-only { display: none !important; }
  .m-eq-cards, .m-item-cards { display: none; }
  header.top {
    background: #16324a;
    color: #fff;
    padding: 18px 28px 0;
  }
  header.top h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: 0.2px; }
  header.top .top-row {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  header.top .page-ver {
    flex: 0 0 auto;
    font-size: 12px;
    font-weight: 600;
    color: #9eb4c6;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 999px;
    padding: 4px 10px;
    letter-spacing: 0.2px;
  }
  header.top p { margin: 6px 0 14px; color: #c9d6e2; font-size: 13px; }
  nav.tabs { display: flex; gap: 6px; align-items: flex-end; flex-wrap: wrap; }
  nav.tabs button {
    appearance: none;
    border: 0;
    background: transparent;
    color: #d5e2ec;
    padding: 10px 16px;
    border-radius: 10px 10px 0 0;
    cursor: pointer;
    font: inherit;
    font-weight: 600;
  }
  nav.tabs button.active { background: var(--bg); color: var(--ink); }
  .map-toolbar {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    margin-bottom: 14px;
  }
  .map-dir {
    display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: #fff;
  }
  .map-dir button {
    border: 0; background: transparent; padding: 7px 14px; cursor: pointer; font: inherit; font-weight: 650;
  }
  .map-dir button.on { background: #16324a; color: #fff; }
  .map-wrap {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 18px 16px;
    overflow-x: auto;
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
  }
  .map-line {

    align-items: stretch;

    min-width: 100%;
    padding: 4px 2px 10px;
    box-sizing: border-box;
  }
  .map-line.rtl { flex-direction: row-reverse; }
  .map-unit {
    width: 78px;
    min-height: 150px;
    border: 2px solid #2c3e50;
    border-radius: 22px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 14px 8px 12px;
    box-sizing: border-box;
    color: #fff;
    font-weight: 800;
    font-size: 15px;
    line-height: 1.25;
    text-align: center;

  main { padding: 18px 28px 40px; max-width: 1440px; margin: 0 auto; width: 100%; box-sizing: border-box; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0 12px; }

  .pct.zero { color: var(--high); }
  .pct.part { color: #9a5b00; }
  .pct.full { color: var(--done); }
  .badge {
    display: inline-block;
    border-radius: 999px;
    padding: 2px 8px;
    font-size: 12px;
    font-weight: 650;
    white-space: nowrap;
  }
  .u-高 { background: #fdecea; color: var(--high); }
  .u-中 { background: #fff4e0; color: var(--mid); }
  .u-低 { background: #e8f6ee; color: var(--low); }
  .s-未開始 { background: #eef1f4; color: var(--idle); }
  .s-進行中 { background: #e7f3fb; color: var(--run); }
  .s-延誤中 { background: #fdecea; color: var(--delay); }
  .s-已完成 { background: #e8f6ee; color: var(--done); }
  .tag {
    display: inline-block;
    min-width: 52px;
    text-align: center;
    border-radius: 6px;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    padding: 2px 6px;
  }
  .tag.板階段 { background: var(--board); }
  .tag.組裝段 { background: var(--assy); }
  .tag.測試段 { background: var(--test); }
  .section-title { margin: 18px 0 8px; font-size: 16px; }
  .note { color: var(--muted); font-size: 12px; margin-top: 10px; }
  .split { display: grid; grid-template-columns: 280px 1fr; gap: 12px; align-items: start; }
  .eq-list { background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: auto; max-height: calc(100vh - 250px); }

    width: 100%;
    text-align: left;
    border: 0;
    border-bottom: 1px solid #edf0f3;

    font: inherit;
  }

  .detail h2 { margin: 0 0 4px; font-size: 18px; }
  .who { color: var(--muted); margin-bottom: 10px; }
  .stage-switch { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }

  .btn-add, .btn-add-eq {

    border: 1px solid #16324a !important;
    background: #16324a !important;
    color: #fff !important;

    padding: 6px 14px !important;
    font-weight: 700 !important;

    font: inherit;
  }

  }

  }
  .edit-table .seg-select.板階段 { background: #e8f3f9; color: var(--board); font-weight: 700; }
  .edit-table .seg-select.組裝段 { background: #e8f7ef; color: var(--assy); font-weight: 700; }
  .edit-table .seg-select.測試段 { background: #fff1e4; color: var(--test); font-weight: 700; }
  .high-count { font-variant-numeric: tabular-nums; font-weight: 700; text-align: center; }
  .item-name-wrap { display: flex; align-items: center; gap: 6px; min-width: 200px; }
  .item-fold {
    flex: 0 0 auto;
    width: 28px; height: 28px;
    border: 1px solid #d5dbe3;
    background: #f7f9fb;
    border-radius: 8px;
    cursor: pointer;
    font: inherit;
    font-size: 11px;
    color: #16324a;
    padding: 0;
  }
  .item-fold.open { background: #16324a; color: #fff; border-color: #16324a; }
  .item-name-wrap input[data-field="item"] { flex: 1; min-width: 0; }

    border: 1px solid #d5dbe3;

    cursor: pointer;
    font: inherit;
    color: var(--ink);
  }
  .item-name-hit:hover { border-color: #6f9fc4; background: #f3f7fb; }
  .item-name-hit.has-note { box-shadow: inset 3px 0 0 #1c8a5a; }
  tr.remark-row td {
    background: #f4f7fa;
    border-bottom: 1px solid #d8dee6;
    padding: 10px 12px 12px;
  }
  .remark-box {
    display: grid;
    gap: 6px;
  }
  .remark-box label {
    font-size: 12px;
    font-weight: 700;
    color: #3d4854;
  }
  .remark-box textarea {
    width: 100%;
    min-height: 72px;
    border: 1px solid #d5dbe3;
    border-radius: 10px;
    padding: 8px 10px;
    font: inherit;
    resize: vertical;
    box-sizing: border-box;
    background: #fff;
  }
  .remark-box textarea:focus {
    outline: 2px solid #9ec3e0;
    border-color: #6f9fc4;
  }
  .date-cell { position: relative; min-width: 128px; vertical-align: top; }
  .date-hit {
    width: 100%;
    border: 1px solid #d5dbe3;
    border-radius: 8px;
    background: #fff;
    padding: 6px 8px;
    font: inherit;
    text-align: left;
    cursor: pointer;
    color: var(--ink);
    white-space: nowrap;
  }
  .date-hit:hover, .date-hit.open {
    border-color: #6f9fc4;

  }
  .date-hit.empty { color: var(--muted); }
  .date-drop {
    display: none;

    border-radius: 12px;

  }
  .date-drop.open { display: grid; }
  .date-drop label {
    font-size: 12px;
    font-weight: 700;
    color: #3d4854;
  }
  .date-drop input {
    width: 100%;
    border: 1px solid #d5dbe3;
    border-radius: 8px;
    padding: 6px 8px;
    font: inherit;
    box-sizing: border-box;
  }
  .btn-save {
    border: 1px solid #1c8a5a;
    background: #1c8a5a;
    color: #fff;
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
    font: inherit;
    font-weight: 700;
  }
  .btn-cloud {
    border: 1px solid #2b6cb0;
    background: #2b6cb0;
    color: #fff;
    border-radius: 999px;
    padding: 7px 12px;
    cursor: pointer;
    font: inherit;
    font-weight: 700;
  }
  .btn-cloud.ghost {
    background: #fff;
    color: #2b6cb0;
  }
  .btn-cloud.dirty {
    background: #c05621;

  }
  .cloud-bar {
    margin: 0 0 10px;
    padding: 8px 12px;

    flex-wrap: wrap;

    align-items: center;
  }

  }

  .login-gate {

  }

  body.locked nav.tabs,

  body.locked header.top p { display: none !important; }

    cursor: pointer;

  }

  }

<script>
const BASE = JSON.parse(document.getElementById("payload").textContent);
const STORE_KEY = "vivo_r01_line_dashboard_" + (BASE.source || "default");
const URG_OPTS = ["高", "中", "低"];
const STATUS_OPTS = ["未開始", "進行中", "延誤中", "已完成"];
const REQUIRE_CLOUD_LOGIN = true;
const DATA = loadData();
const state = { tab: "weekly", seg: "全部", q: "", eq: 0, stage: 0, onlyHigh: false, dirty: false, mapDir: "ltr", openRemark: null, openDates: null, syncConflict: false, syncCheckBusy: false, mobile: false };
let cloudWatchTimer = null;
const CLOUD_WATCH_MS = 60000;
const MAP_STORE_KEY = STORE_KEY + "_map_dir";
try {
  const savedDir = localStorage.getItem(MAP_STORE_KEY);
  if (savedDir === "ltr" || savedDir === "rtl") state.mapDir = savedDir;
} catch (e) {}

const PAGE_VERSION = "2026-10-29d"; // 每次改網頁請更新這行日期
function isMobileView() {
  try {
    if (window.matchMedia && window.matchMedia("(max-width: 900px)").matches) return true;
  } catch (e) {}
  try {
    if (Math.min(screen.width || 0, window.innerWidth || 0) > 0 &&
        Math.min(screen.width || 9999, window.innerWidth || 9999) <= 900) return true;
  } catch (e2) {}
  const ua = navigator.userAgent || "";
  return /Android|iPhone|iPad|iPod|Mobile/i.test(ua);
}
function applyMobileClass() {
  const next = isMobileView();
  const changed = next !== state.mobile;
  state.mobile = next;
  document.documentElement.classList.toggle("is-mobile", next);
  document.body.classList.toggle("is-mobile", next);
  return changed;
}

function clone(v) { return JSON.parse(JSON.stringify(v)); }
function loadData() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return clone(BASE);
    const saved = JSON.parse(raw);
    if (!saved || !Array.isArray(saved.equipment)) return clone(BASE);
    const data = clone(BASE);
    const byKey = {};
    saved.equipment.forEach(eq => { byKey[eq.seg + "|" + eq.name] = eq; });
    data.equipment.forEach(eq => {
      const hit = byKey[eq.seg + "|" + eq.name];
      if (!hit || !Array.isArray(hit.stages)) return;
      eq.stages = hit.stages;
    });
    return data;
  } catch (e) {
    return clone(BASE);
  }
}
function cloudPayload() {
  return {
    source: DATA.source,
    savedAt: new Date().toISOString(),
    equipment: DATA.equipment,
    milestones: DATA.milestones
  };
}
/** 比對用指紋（忽略 savedAt，避免時間戳造成誤判） */
function syncFingerprint(payload) {
  if (!payload) return "";
  try {
    return JSON.stringify({
      source: payload.source || "",
      equipment: payload.equipment || [],
      milestones: payload.milestones || []
    });
  } catch (e) {
    return "";
  }
}
function showSyncConflict(msg) {
  const el = document.getElementById("syncConflict");
  const p = document.getElementById("syncConflictMsg");
  if (p && msg) p.textContent = msg;
  if (el) el.classList.add("show");
  state.syncConflict = true;
}
function hideSyncConflict() {
  const el = document.getElementById("syncConflict");
  if (el) el.classList.remove("show");
  state.syncConflict = false;
}
function stopCloudWatch() {
  if (cloudWatchTimer) {
    clearInterval(cloudWatchTimer);
    cloudWatchTimer = null;
  }
}
function startCloudWatch() {
  stopCloudWatch();
  cloudWatchTimer = setInterval(function () { checkCloudDrift(); }, CLOUD_WATCH_MS);
}
async function checkCloudDrift() {
  if (!isCloudLoggedIn() || state.syncCheckBusy) return;
  if (document.hidden) return;
  state.syncCheckBusy = true;
  try {
    const cloud = await LineOneDrive.downloadJson();
    if (!cloud) return;
    const localFp = syncFingerprint(cloudPayload());
    const cloudFp = syncFingerprint(cloud);
    if (!localFp || !cloudFp) return;
    if (localFp === cloudFp) {
      hideSyncConflict();
      return;
    }
    const localDirty = state.dirty ? "本機有未儲存變更，且" : "";
    showSyncConflict(
      localDirty + "雲端資料與目前網頁內容不同。若要保留此裝置的修改請按「儲存到雲端」；若要以雲端為準請按「重新載入雲端」。"
    );
  } catch (e) {
    console.warn(e);
  } finally {
    state.syncCheckBusy = false;
  }
}
function applySavedEquipment(saved) {
  if (!saved || !Array.isArray(saved.equipment)) return false;
  // 雲端為準：整份覆蓋（避免與網頁內建 BASE 合併後筆數不一致）
  DATA.equipment = clone(saved.equipment);
  if (Array.isArray(saved.milestones) && saved.milestones.length) {
    DATA.milestones = clone(saved.milestones);
  }
  return true;
}
/** 誤刪還原：前 4 台設備 + 送板機架線前準備 01~04 */
function restoreAccidentalDeletes() {
  let addedEq = 0;
  let addedItems = 0;
  BASE.equipment.slice(0, 4).forEach((baseEq, i) => {
    const key = baseEq.seg + "|" + baseEq.name;
    const exists = DATA.equipment.some(e => (e.seg + "|" + e.name) === key);
    if (!exists) {
      DATA.equipment.splice(Math.min(i, DATA.equipment.length), 0, clone(baseEq));
      addedEq += 1;
    }
  });
  const baseEq = BASE.equipment.find(e => e.name === "送板機");
  const curEq = DATA.equipment.find(e => e.name === "送板機");
  if (baseEq && curEq && baseEq.stages && baseEq.stages[0] && curEq.stages && curEq.stages[0]) {
    const need = (baseEq.stages[0].items || []).slice(0, 4);
    const cur = curEq.stages[0].items || [];
    const have = new Set(cur.map(it => String(it.item || "")));
    const missing = need.filter(it => !have.has(String(it.item || "")));
    if (missing.length) {
      const rest = cur.filter(it => !need.some(n => n.item === it.item));
      const ordered = need.map(n => {
        const hit = cur.find(it => it.item === n.item);
        return hit ? hit : clone(n);
      });
      curEq.stages[0].items = ordered.concat(rest);
      addedItems = missing.length;

function ratioOf(items) {

}

function pctClass(r) {

function stageStatus(items, ratio) {

function highOpen(items) {

function qtyNumber(v) {
  const n = parseFloat(v);
  if (Number.isNaN(n) || n <= 0) return 1;
  return Math.floor(n);
}
function mapLabel(name, qty, expand) {
  const n = qtyNumber(qty);
  if (!expand && n > 1) return escapeHtml(name) + "\nX" + n;
  return escapeHtml(name);
}
function buildMapUnits() {
  const list = visibleEq();
  const units = [];
  list.forEach((eq, order) => {
    const ei = DATA.equipment.indexOf(eq);
    const n = qtyNumber(eq.qty);
    // qty 2~3：拆成多個框（如 ICT×2）；qty>=4：單框標 Xn（如組裝工作站 X4）
    const expand = n >= 2 && n <= 3;
    const count = expand ? n : 1;
    const tone = order % 2 === 0 ? "tone-a" : "tone-b";
    for (let i = 0; i < count; i++) {
      units.push({
        ei,
        tone,
        label: mapLabel(eq.name, eq.qty, expand),
        title: eq.seg + "｜" + eq.name + "｜數量 " + (eq.qty || "-") + "｜" + pctText(ratioOf(prepItems(eq)))
      });
    }
  });
  return units;
}
function renderMap() {
  const units = buildMapUnits();
  const boxes = units.map(u =>
    `<button type="button" class="map-unit ${u.tone}" data-map-eq="${u.ei}" title="${escapeAttr(u.title)}">${u.label}</button>`
  ).join("");
  document.getElementById("map").innerHTML = `
    ${toolbar("")}
    <div class="map-toolbar">
      <strong>設備總圖</strong>
      <div class="map-dir">
        <button type="button" data-map-dir="ltr" class="${state.mapDir === "ltr" ? "on" : ""}">由左至右</button>
        <button type="button" data-map-dir="rtl" class="${state.mapDir === "rtl" ? "on" : ""}">由右至左</button>
      </div>
      <span class="map-legend">倒角框依設備順序藍／橘交替；數量 2～3 拆框，≥4 顯示 Xn。點框可進項目清單。</span>
    </div>
    <div class="map-wrap">
      <div class="map-line ${state.mapDir === "rtl" ? "rtl" : ""}">
        ${boxes || `<div class="note">沒有可顯示的設備</div>`}
      </div>
    </div>`;
}

function updateFoot() {
  const flag = state.dirty ? "　｜　有未寫回 Excel 的本機修改" : "";
  const verEl = document.getElementById("pageVer");
  if (verEl) verEl.textContent = "版次 " + PAGE_VERSION;
  document.getElementById("foot").textContent =
    `版次 ${PAGE_VERSION}　｜　資料來源 ${DATA.source}　｜　網頁產生 ${DATA.built}　｜　完成率由細項即時彙總${flag}`;
}

function render() {
  applyMobileClass();
  // 有雲端登入需求時：未登入一律不顯示資料（即使腳本載入失敗也不放行）
  if (REQUIRE_CLOUD_LOGIN && !isCloudLoggedIn()) {
    renderLoginGate();
    return;
  }
  document.body.classList.remove("locked");
  document.getElementById("title").textContent = DATA.title;
  document.getElementById("subtitle").textContent = DATA.subtitle;
  updateFoot();
  document.querySelectorAll("nav.tabs button").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.tab === state.tab);
  });
  ["weekly", "overview", "items", "map"].forEach(id => {
    document.getElementById(id).classList.toggle("hidden", id !== state.tab);
  });
  document.querySelector("main").classList.toggle("map-wide", state.tab === "map");
  const showKpi = state.tab !== "map";
  document.getElementById("kpis").classList.toggle("hidden", !showKpi);
  if (showKpi) renderKpis();
  if (state.tab === "weekly") renderWeekly();
  if (state.tab === "overview") renderOverview();
  if (state.tab === "items") renderItems();
  if (state.tab === "map") renderMap();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}
function escapeAttr(s) { return escapeHtml(s); }

function exportChanges() {
  const payload = {
    source: DATA.source,
    exportedAt: new Date().toISOString(),
    equipment: DATA.equipment.map(eq => ({
      startRow: eq.startRow || null,
      idx: eq.idx,
      seg: eq.seg,
      name: eq.name,
      qty: eq.qty,
      pm: eq.pm,
      owner: eq.owner,
      stages: eq.stages
    }))
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "架線進度_變更.json";
  a.click();
  URL.revokeObjectURL(a.href);
  toast("已下載 架線進度_變更.json，請執行寫回 bat");
}

function patchEqField(eqIdx, field, raw) {
  const eq = DATA.equipment[eqIdx];
  if (!eq) return;
  if (field === "idx") eq.idx = String(raw || "").trim();
  if (field === "name") eq.name = String(raw || "").trim() || "新設備";
  if (field === "qty") eq.qty = String(raw || "").trim() || "-";
  if (field === "owner") eq.owner = String(raw || "").trim() || "-";
  if (field === "seg" && DATA.segOrder.includes(raw)) eq.seg = raw;
  if (field === "pct") {
    let n = parseFloat(raw);
    if (Number.isNaN(n)) n = 0;
    n = Math.max(0, Math.min(100, n)) / 100;
    prepItems(eq).forEach(it => { it.pct = n; });
  }
  if (field === "due") {
    const due = fromDateInput(raw);
    eq.stages[0].due = due;
    prepItems(eq).forEach(it => { it.due = due; });
  }
  if (field === "status" && STATUS_OPTS.includes(raw)) {
    prepItems(eq).forEach(it => { it.status = raw; });
  }
  saveLocal();
  renderKpis();
  const hosts = document.querySelectorAll(`[data-eq-idx="${eqIdx}"]`);
  hosts.forEach(row => {
    const items = prepItems(eq);
    const ratio = ratioOf(items);
    const bar = row.querySelector(".bar-cell");
    if (bar) bar.innerHTML = barHtml(ratio);
    const pct = row.querySelector('[data-eq-field="pct"]');
    if (pct) {
      pct.className = "pct-input " + pctClass(ratio);
      if (document.activeElement !== pct) pct.value = (ratio * 100).toFixed(1);
    }
    const high = row.querySelector(".high-count");
    if (high) high.textContent = String(highOpen(items));
    const st = row.querySelector('[data-eq-field="status"]');
    if (st) {
      const val = statusSelectValue(items, ratio);
      st.className = "s-" + val;
      if (document.activeElement !== st) st.value = val;
    }
    const seg = row.querySelector('[data-eq-field="seg"]');
    if (seg) seg.className = "seg-select " + eq.seg;
    const title = row.querySelector(".m-title");
    if (title && row.classList.contains("m-eq-card")) {
      title.textContent = (eq.idx || "") + ". " + (eq.name || "未命名");
    }
  });
  // refresh summary cards without nuking focused input
  const cardsHost = document.querySelector("#weekly .cards");
  if (cardsHost && document.activeElement && document.activeElement.closest("[data-eq-idx]")) {
    const groups = DATA.segOrder.map(seg => {
      const eqs = DATA.equipment.filter(e => e.seg === seg);
      const items = eqs.flatMap(prepItems);
      const mile = (DATA.milestones.find(m => m.seg === seg) || {}).dates || [];
      return { seg, count: eqs.length, ratio: ratioOf(items), high: highOpen(items), due: mile[0] || "" };
    });
    const cls = { "板階段": "seg-board", "組裝段": "seg-assy", "測試段": "seg-test" };
    cardsHost.innerHTML = groups.map(g => `<article class="card ${cls[g.seg] || ""}">
      <h2>${g.seg}</h2>
      <div class="meta"><span>${g.count} 台設備</span><span>高急迫 ${g.high}</span></div>
      <div class="pct ${pctClass(g.ratio)}" style="font-size:28px">${pctText(g.ratio)}</div>
      ${barHtml(g.ratio)}
      <div class="meta" style="margin-top:8px"><span>預計完成</span><span>${g.due || "-"}</span></div>
    </article>`).join("");
  }
}

function patchItemField(itemIdx, field, raw) {
  const eq = DATA.equipment[state.eq];
  const it = eq.stages[state.stage].items[itemIdx];
  if (!it) return;
  if (field === "item") it.item = String(raw || "").trim() || "未命名項目";
  if (field === "note") it.note = String(raw || "");
  if (field === "pct") {
    let n = parseFloat(raw);
    if (Number.isNaN(n)) n = 0;
    n = Math.max(0, Math.min(100, n));
    it.pct = n / 100;
  }
  if (field === "urg") it.urg = URG_OPTS.includes(raw) ? raw : "中";
  if (field === "status") it.status = STATUS_OPTS.includes(raw) ? raw : "未開始";
  if (field === "start") it.start = fromDateInput(raw);
  if (field === "due") {
    it.due = fromDateInput(raw);
    syncStageDue(eq, state.stage);
  }
  if (field === "actual") it.actual = fromDateTimeInput(raw);
  saveLocal();
  renderKpis();
  document.querySelectorAll(`[data-item-idx="${itemIdx}"]`).forEach(row => {
    if (!row.matches("tr[data-item-idx], .m-item-card")) return;
    const r = Number(it.pct) || 0;
    const bar = row.querySelector(".bar-cell");
    if (bar) bar.innerHTML = barHtml(r);
    const pct = row.querySelector(".pct-input");
    if (pct) {
      pct.className = "pct-input " + pctClass(r);
      if (document.activeElement !== pct) pct.value = (r * 100).toFixed(1);
    }
    const urg = row.querySelector('[data-field="urg"]');
    if (urg) urg.className = "u-" + it.urg;
    const st = row.querySelector('[data-field="status"]');
    if (st) st.className = "s-" + it.status;
    const hit = row.querySelector(".item-name-hit");
    if (hit) {
      hit.textContent = it.item || "未命名項目";
      hit.classList.toggle("has-note", !!(it.note && String(it.note).trim()));
    }
    const dateHit = row.querySelector(".date-hit");
    if (dateHit) {
      const text = displayDue(it);
      dateHit.textContent = text || "設定日期";
      dateHit.classList.toggle("empty", !text);
    }
  });
  document.querySelectorAll(".eq-list button.on .sub, .m-eq-scroll button.on .sub").forEach(active => {
    const r = ratioOf(eq.stages[state.stage].items);
    active.textContent = `${eq.seg}　${pctText(r)}　${eq.owner}`;
  });
  const minis = document.querySelector(".mini-bars");
  if (minis) {
    minis.innerHTML = eq.stages.map(st => {
      const r = ratioOf(st.items);
      return `<i title="${pctText(r)}"><b style="width:${Math.round(r * 100)}%"></b></i>`;
    }).join("");
  }
}

async function cloudLogin() {
  try {
    toast("正在登入…");
    await LineOneDrive.login();
    toast("已登入雲端");
    startCloudWatch();
    render();
    // 登入後自動嘗試載入雲端資料
    try {
      const saved = await LineOneDrive.downloadJson();
      if (saved) {
        const r = applyCloudAndRestore(saved);
        if (r.ok) {
          if (r.restored) {
            saveLocal("已還原誤刪項目，請按「儲存」寫回雲端");
          } else {
            state.dirty = false;
            saveLocal("已從雲端載入（" + DATA.equipment.length + " 台）", { clearDirty: true });
          }
          hideSyncConflict();
          render();
        }
      }
    } catch (e2) {
      console.warn(e2);
    }
  } catch (e) {
    console.error(e);
    toast("登入失敗：" + (e.message || e));
  }
}
async function cloudPull() {
  try {
    if (!isCloudLoggedIn()) {
      await cloudLogin();
      return;
    }
    toast("正在從雲端載入…");
    const saved = await LineOneDrive.downloadJson();
    if (!saved) {
      toast("雲端尚無資料，請先按「儲存」上傳");
      return;
    }
    const r = applyCloudAndRestore(saved);
    if (!r.ok) {
      toast("雲端資料格式不符");
      return;
    }
    if (r.restored) {
      saveLocal("已還原誤刪項目，請按「儲存」寫回雲端");
    } else {
      state.dirty = false;
      saveLocal("已從雲端載入（" + DATA.equipment.length + " 台）", { clearDirty: true });
    }
    hideSyncConflict();
    render();
  } catch (e) {
    console.error(e);
    toast("載入失敗：" + (e.message || e));
  }
}
async function cloudPush() {
  try {
    if (!isCloudLoggedIn()) {
      await cloudLogin();
      return;
    }
    toast("正在儲存到雲端…");
    const payload = cloudPayload();
    await LineOneDrive.uploadJson(payload);
    localStorage.setItem(STORE_KEY, JSON.stringify(payload));
    state.dirty = false;
    hideSyncConflict();
    updateCloudBar();
    toast("已儲存到雲端（" + DATA.equipment.length + " 台）");
    render();
  } catch (e) {
    console.error(e);
    toast("儲存失敗：" + (e.message || e));
  }
}

document.body.addEventListener("click", ev => {
  if (ev.target.closest("[data-sync-save]")) { cloudPush(); return; }
  if (ev.target.closest("[data-sync-reload]")) { cloudPull(); return; }
  if (ev.target.closest("[data-sync-later]")) { hideSyncConflict(); return; }
  if (ev.target.closest("[data-cloud-login]")) { cloudLogin(); return; }
  if (ev.target.closest("[data-cloud-pull]")) { cloudPull(); return; }
  if (ev.target.closest("[data-cloud-push]")) { cloudPush(); return; }
  if (ev.target.closest("[data-cloud-logout]")) {
    stopCloudWatch();
    hideSyncConflict();
    LineOneDrive.logout().then(() => {
      toast("已登出");
      document.body.classList.add("locked");
      render();
    }).catch(e => toast(String(e.message || e)));
    return;
  }
  // 未登入時不處理分頁／資料操作
  if (REQUIRE_CLOUD_LOGIN && !isCloudLoggedIn()) return;
  const tab = ev.target.closest("nav.tabs button");
  if (tab) { state.tab = tab.dataset.tab; render(); return; }
  const mapDir = ev.target.closest("[data-map-dir]");
  if (mapDir) {
    state.mapDir = mapDir.dataset.mapDir === "rtl" ? "rtl" : "ltr";
    try { localStorage.setItem(MAP_STORE_KEY, state.mapDir); } catch (e) {}
    render();
    return;
  }
  const mapEq = ev.target.closest("[data-map-eq]");
  if (mapEq) {
    state.eq = Number(mapEq.dataset.mapEq);
    state.tab = "items";
    state.stage = 0;
    render();
    return;
  }
  const seg = ev.target.closest("[data-seg]");
  if (seg) { state.seg = seg.dataset.seg; render(); return; }
  const stage = ev.target.closest("[data-stage]");
  if (stage) {
    state.stage = Number(stage.dataset.stage);
    state.openRemark = null;
    state.openDates = null;
    render();
    return;
  }
  const eq = ev.target.closest("[data-eq]");
  if (eq) {
    state.eq = Number(eq.dataset.eq);
    state.openRemark = null;
    state.openDates = null;
    render();
    return;
  }
  const toggleRemark = ev.target.closest("[data-toggle-remark]");
  if (toggleRemark) {
    const idx = Number(toggleRemark.dataset.toggleRemark);
    state.openRemark = state.openRemark === idx ? null : idx;
    state.openDates = null;
    render();
    const box = document.querySelector(`tr[data-remark-for="${idx}"] textarea`)
      || document.querySelector(`.remark-box[data-remark-for="${idx}"] textarea`);
    if (state.openRemark === idx && box) box.focus();
    return;
  }
  const toggleDates = ev.target.closest("[data-toggle-dates]");
  if (toggleDates) {
    const idx = Number(toggleDates.dataset.toggleDates);
    state.openDates = state.openDates === idx ? null : idx;
    render();
    return;
  }
  if (!ev.target.closest(".date-drop") && !ev.target.closest("[data-toggle-dates]")) {
    if (state.openDates !== null && state.tab === "items") {
      state.openDates = null;
      const drop = document.querySelector(".date-drop.open");
      if (drop) {
        render();
        return;
      }
    }
  }
  if (ev.target.closest("[data-add-item]")) {
    const items = DATA.equipment[state.eq].stages[state.stage].items;
    const n = items.length + 1;
    items.push({
      item: String(n).padStart(2, "0") + ". 新項目",
      pct: 0,
      urg: "中",
      start: "",
      due: items[0] && items[0].due ? items[0].due : "",
      actual: "",
      status: "未開始",
      note: "",
      photos: []
    });
    syncStageDue(DATA.equipment[state.eq], state.stage);
    state.onlyHigh = false;
    state.openRemark = items.length - 1;
    state.openDates = null;
    saveLocal("已新增項目");
    render();
    return;
  }
  if (ev.target.closest("[data-add-eq]")) {
    const seg = state.seg === "全部" ? "測試段" : state.seg;
    const template = DATA.equipment.find(eq => eq.seg === seg) || DATA.equipment[0];
    const neu = {
      idx: nextEqIdx(),
      seg,
      name: "新設備",
      qty: "1",
      pm: template ? template.pm : "-",
      owner: "-",
      startRow: null,
      stages: defaultStagesFrom(template)
    };
    DATA.equipment.push(neu);
    state.eq = DATA.equipment.length - 1;
    saveLocal("已新增設備");
    render();
    return;
  }
  const delEq = ev.target.closest("[data-del-eq]");
  if (delEq) {
    const idx = Number(delEq.dataset.delEq);
    if (idx >= 0 && idx < DATA.equipment.length) {
      const name = DATA.equipment[idx].name;
      if (confirm("確定刪除設備「" + name + "」？")) {
        DATA.equipment.splice(idx, 1);
        if (state.eq >= DATA.equipment.length) state.eq = Math.max(0, DATA.equipment.length - 1);
        saveLocal("已刪除設備");
        render();
      }
    }
    return;
  }

  const uploadPhotoBtn = ev.target.closest("[data-upload-photo]");
  if (uploadPhotoBtn) {
    const idx = Number(uploadPhotoBtn.dataset.uploadPhoto);
    const wrap = uploadPhotoBtn.closest(".photo-cell") || uploadPhotoBtn.parentElement;
    const input = (wrap && wrap.querySelector("[data-photo-file]")) || document.querySelector(`[data-photo-file="${idx}"]`);
    if (input) input.click();
    return;
  }
  const delPhoto = ev.target.closest("[data-del-photo]");
  if (delPhoto) {
    const idx = Number(delPhoto.dataset.delPhoto);
    const pi = Number(delPhoto.dataset.photoI);
    const it = DATA.equipment[state.eq].stages[state.stage].items[idx];
    if (!it || !Array.isArray(it.photos) || !it.photos[pi]) return;
    const photo = it.photos[pi];
    if (!confirm("確定刪除此照片？\n" + (photo.name || ""))) return;
    const finish = () => {
      it.photos.splice(pi, 1);
      saveLocal("已刪除照片");
      render();
    };
    if (window.LineOneDrive && photo.id && isCloudLoggedIn()) {
      toast("正在刪除雲端照片…");
      LineOneDrive.deleteDriveFile(photo.id).then(finish).catch(e => {
        console.warn(e);
        if (confirm("雲端刪除失敗，仍從清單移除？\n" + (e.message || e))) finish();
      });
    } else {
      finish();
    }
    return;
  }

  const del = ev.target.closest("[data-del-item]");
  if (del) {
    const idx = Number(del.dataset.delItem);
    const items = DATA.equipment[state.eq].stages[state.stage].items;
    if (idx >= 0 && idx < items.length) {
      items.splice(idx, 1);
      syncStageDue(DATA.equipment[state.eq], state.stage);
      saveLocal("已刪除項目");
      render();
    }
    return;
  }
  if (ev.target.closest("[data-export-xlsx]")) {
    exportChanges();
  }
});

document.body.addEventListener("change", async (ev) => {
  const photoInput = ev.target.closest("[data-photo-file]");
  if (!photoInput) return;
  const idx = Number(photoInput.dataset.photoFile);
  const file = photoInput.files && photoInput.files[0];
  photoInput.value = "";
  if (!file) return;
  if (!window.LineOneDrive || !isCloudLoggedIn()) {
    toast("請先登入 Google");
    return;
  }
  const eq = DATA.equipment[state.eq];
  const it = eq.stages[state.stage].items[idx];
  if (!it) return;
  try {
    toast("正在上傳照片…");
    const label = (eq.idx || "") + "_" + String(it.item || "item").slice(0, 20);
    const meta = await LineOneDrive.uploadPhoto(file, label);
    if (!Array.isArray(it.photos)) it.photos = [];
    it.photos.push(meta);
    saveLocal("照片已上傳");
    try {
      await LineOneDrive.uploadJson(cloudPayload());
      state.dirty = false;
      updateCloudBar();
    } catch (e2) {
      console.warn(e2);
      toast("照片已上傳，但進度儲存失敗，請再按「儲存」");
    }
    render();
    toast("照片已上傳到雲端");
  } catch (e) {
    console.error(e);
    toast("上傳失敗：" + (e.message || e));
  }
});

document.body.addEventListener("change", ev => {

  const el = ev.target;
  if (el.id === "onlyHigh") {
    state.onlyHigh = el.checked;
    render();
    return;
  }
  const eqRow = el.closest("[data-eq-idx]");
  if (eqRow && el.dataset.eqField) {
    patchEqField(Number(eqRow.dataset.eqIdx), el.dataset.eqField, el.value);
    return;
  }
  if (!el.dataset.field) return;
  if (el.dataset.itemIdx !== undefined && el.dataset.itemIdx !== "") {
    patchItemField(Number(el.dataset.itemIdx), el.dataset.field, el.value);
    return;
  }
  const row = el.closest("[data-item-idx]");
  if (!row) return;
  patchItemField(Number(row.dataset.itemIdx), el.dataset.field, el.value);
});
document.body.addEventListener("input", ev => {
  const el = ev.target;
  if (el.matches('input[type="search"]')) {
    state.q = el.value;
    render();
    const box = document.querySelector('input[type="search"]');
    if (box) { box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
    return;
  }
  if (el.dataset.field === "note" && el.dataset.itemIdx !== undefined) {
    patchItemField(Number(el.dataset.itemIdx), "note", el.value);
  }
});
{
  const r0 = restoreAccidentalDeletes();
  if (r0.addedEq || r0.addedItems) {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(cloudPayload()));
    } catch (e) {}
  }
}
applyMobileClass();
render();
let mobileResizeTimer = null;
window.addEventListener("resize", function () {
  clearTimeout(mobileResizeTimer);
  mobileResizeTimer = setTimeout(function () {
    if (applyMobileClass()) render();
  }, 200);
});
window.addEventListener("orientationchange", function () {
  setTimeout(function () {
    if (applyMobileClass()) render();
  }, 250);
});
if (window.LineOneDrive) {
  LineOneDrive.ensureInit().then(() => {
    LineOneDrive.startPresence(function () { updateCloudBar(); });
    updateCloudBar();
    render();
  }).catch(e => {
    console.warn(e);
    updateCloudBar();
  });
}
</script>
</body>
</html>
